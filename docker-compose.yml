services:
  postgres:
    image: postgres:16-alpine
    container_name: aifpl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aifpl
      POSTGRES_PASSWORD: aifpl
      POSTGRES_DB: aifpl
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aifpl -d aifpl"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aifpl-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
